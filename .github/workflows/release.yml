name: Release Package

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. Build Core Server and Web Dashboard
      - name: Install Core Dependencies
        run: npm ci || npm install

      - name: Build Core CLI
        run: npm run build

      - name: Build Web Dashboard
        run: |
          cd dashboard
          npm install
          npm run build
          cd ..

      - name: Pack Core CLI Tarball
        run: npm pack

      # 2. Build & Pack Node.js SDK
      - name: Build & Pack Node.js SDK
        working-directory: ./sdks/nodejs
        run: |
          npm install
          npm run build
          npm pack

      # 3. Build & Pack Python SDK
      - name: Build & Pack Python SDK
        working-directory: ./sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel
          python -m build

      # 4. Consolidate Release Assets
      - name: Organize Release Assets
        run: |
          mkdir release-assets
          mv memox-core-*.tgz release-assets/
          mv sdks/nodejs/memox-sdk-*.tgz release-assets/
          mv sdks/python/dist/* release-assets/

      # 5. Create GitHub Release and Upload Assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build and Publish Docker Image to GHCR
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
