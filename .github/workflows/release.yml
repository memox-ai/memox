name: Release Package

on:
  push:
    tags:
      - 'v*'
    branches-ignore:
      - 'main'
  workflow_dispatch:

jobs:
  # Job 1: Test Build for Development Branches
  test-build:
    name: Build & Test Package
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build
        run: |
          npm ci
          npm run build
          cd dashboard && npm install && npm run build

      - name: Test Build SDKs
        run: |
          cd sdks/nodejs && npm install && npm run build && npm pack
          cd ../python && pip install build && python -m build

  # Job 2: Official Production Release
  release:
    name: Build & GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Core Dependencies
        run: npm ci || npm install

      - name: Build Assets
        run: |
          npm run build
          cd dashboard && npm install && npm run build && cd ..

      - name: Pack Packages
        run: |
          npm pack
          cd sdks/nodejs && npm install && npm run build && npm pack
          cd ../python && pip install build && python -m build

      - name: Organize Release Assets
        run: |
          mkdir release-assets
          mv memox-core-*.tgz release-assets/
          mv sdks/nodejs/memox-sdk-*.tgz release-assets/
          mv sdks/python/dist/* release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}